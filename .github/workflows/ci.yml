name: Check
on: [push, pull_request]

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers spirv-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo xtask bindings --check
      - run: cargo xtask abi
      - run: cargo xtask mock
      - run: spirv-val --target-env vulkan1.2 examples/shaders/roundtrip.spv
      - run: cargo xtask compute
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation

  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      # A normal build must work without the headers submodule or generation tools.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --locked
