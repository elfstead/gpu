name: Check
on: [push, pull_request]

jobs:
  installed-sdk:
    runs-on: ubuntu-24.04
    steps:
      # No submodule, shader compiler or Vulkan driver required for this lane.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config python3
      - run: python3 -B tools/test_installer.py
      - run: python3 -B tools/test-reuse-handoff.py
      - run: python3 -B examples/graphics_scene/test_generated_runner.py
      - run: python3 -B examples/graphics_scene/test_argument_snapshot.py
      - run: python3 -B examples/graphics_scene/test_argument_reuse.py
      - run: python3 -B examples/graphics_scene/test_argument_timing.py
      - run: python3 -B examples/graphics_scene/test_argument_patch.py
      - run: python3 tools/install.py --prefix "$RUNNER_TEMP/ogpu-sdk"
      - run: python3 tools/test-install.py --prefix "$RUNNER_TEMP/ogpu-sdk" --no-gpu --resource-reuse --draw-ranges --indexed-scene
  foundation-sdk:
    runs-on: ubuntu-24.04
    steps:
      # Public consumer builds only; no shader compiler, dataset or GPU required.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config python3 cmake ninja-build
      - run: python3 -B tools/test_installer.py
      - run: python3 -B tools/test_foundation_handoff.py
      - run: python3 -B tools/test_ggml_handoff.py
      - run: python3 -B tools/test_libplacebo_handoff.py
      - run: python3 -B examples/graphics_scene/test_runner.py
      - run: python3 -B examples/graphics_scene/test_reuse.py
      - run: python3 -B examples/graphics_scene/test_range_reuse.py
      - run: cc -std=c11 -Wall -Wextra -Werror -DSCENE_RANGE_REUSE -Iinclude -fsyntax-only examples/graphics_scene/reuse_foundation.c examples/graphics_scene/reuse_foundation_failures.c
      - run: cc -std=c11 -Wall -Wextra -Werror -DSCENE_RANGE_REUSE -DSCENE_RANGE_SCOPES -Iinclude -fsyntax-only examples/graphics_scene/reuse_foundation.c examples/graphics_scene/reuse_foundation_failures.c
      - run: python3 -B examples/graphics_scene/test_frontier.py
      - run: cc -std=c11 -Wall -Wextra -Werror -Iinclude -fsyntax-only examples/graphics_scene/frontier_foundation.c
      - run: cc -std=c11 -Wall -Wextra -Werror -DSCENE_FOUNDATION_FRONTIER_FAILURES -Iinclude -fsyntax-only examples/graphics_scene/foundation_failures.c
      - run: python3 -B examples/graphics_scene/test_foundation_reuse_failures.py
      - run: cc -std=c11 -Wall -Wextra -Werror -Iinclude -Iexamples/graphics_scene -fsyntax-only examples/graphics_scene/reuse_foundation.c examples/graphics_scene/reuse_foundation_generated.c examples/graphics_scene/reuse_foundation_failures.c
      - run: cc -std=c11 -Wall -Wextra -Werror -DSCENE_GENERATED -Iinclude -Iexamples/graphics_scene -fsyntax-only examples/graphics_scene/reuse_foundation_failures.c
      - run: python3 -B examples/graphics_scene/test_generated_runner.py
      - run: python3 -B examples/graphics_scene/test_oracle.py
      - run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -fsyntax-only examples/graphics_scene/foundation.c
      - run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -Iexamples/graphics_scene -fsyntax-only examples/graphics_scene/foundation_generated.c
      - run: python3 -B examples/learned_image/test_foundation_measure.py
      - run: |
          git clone --no-checkout https://github.com/ggml-org/ggml.git "$RUNNER_TEMP/ggml"
          git -C "$RUNNER_TEMP/ggml" checkout --detach 7840aaba1989c6deeefede1d77d5aaf8f52b947e
      - run: python3 tools/install.py --foundation --prefix "$RUNNER_TEMP/ogpu-foundation"
      - run: python3 tools/test-foundation-install.py --prefix "$RUNNER_TEMP/ogpu-foundation" --no-gpu --ggml-source "$RUNNER_TEMP/ggml"
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers spirv-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo xtask bindings --check
      - run: cargo xtask abi
      - run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Iinclude -fsyntax-only examples/foundation.c
      - run: c++ -std=c++17 -Wall -Wextra -Werror -pedantic -x c++ -fsyntax-only docs/drafts/ogpu_next.h
      - run: cargo xtask mock
      - run: spirv-val --target-env vulkan1.2 examples/shaders/roundtrip.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/produce.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/consume.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/triangle.comp.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/triangle.vert.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/triangle.frag.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/reduce.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/image-pattern.frag.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/image-process.comp.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/fullscreen.vert.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/image-read.frag.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/matmul-naive.comp.spv
      - run: spirv-val --target-env vulkan1.2 examples/shaders/matmul-tiled.comp.spv
      - run: bash integrations/ggml/check-shaders.sh
  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      # A normal build must work without the headers submodule or generation tools.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --locked
