name: Modern Vulkan execution (manual)
# Explicit trusted invocation only: never execute arbitrary PR code on a self-hosted runner.
on: workflow_dispatch
permissions:
  contents: read

jobs:
  execution:
    runs-on: [self-hosted, linux, x64, ogpu-modern-vulkan]
    timeout-minutes: 20
    env:
      VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
      VK_LAYER_VALIDATE_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      # Runner provisioning is external: Rust, C/C++, CMake, Ninja, glslang,
      # SPIRV-Tools, curl/gzip/rg and a driver + validation layer meeting the baseline.
      - run: cargo xtask baseline
      - run: cargo xtask compute
      - run: cargo xtask batch
      - run: cargo xtask retirement
      - run: cargo xtask graphics
      - run: cargo xtask image-loop
      - run: spirv-val --target-env vulkan1.4 examples/shaders/heap-process.comp.spv
      - run: spirv-val --target-env vulkan1.4 examples/shaders/heap-sample.frag.spv
      - run: cargo xtask heap-image
      - run: cargo xtask reduction
      - run: cargo xtask matmul
      - run: cargo xtask gpu-tests
      - name: Pin independent consumer
        run: |
          git clone --no-checkout https://github.com/ggml-org/ggml.git target/ggml-source
          git -C target/ggml-source checkout --detach 7840aaba1989c6deeefede1d77d5aaf8f52b947e
      - run: bash integrations/ggml/prepare.sh
      - run: bash integrations/ggml/run.sh target/ggml-source
