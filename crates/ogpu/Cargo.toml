[package]
name = "ogpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libloading = "=0.8.9"

[target.'cfg(target_os = "linux")'.dependencies]
ogpu-vulkan-sys = { path = "../vulkan-sys" }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "=0.33.0"
objc = "=0.2.7"
foreign-types = "=0.5.0"
spirv-cross2 = { version = "=0.7.1", default-features = false, features = ["msl"] }
