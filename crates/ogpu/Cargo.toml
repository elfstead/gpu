[package]
name = "ogpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libloading = "=0.8.9"

[features]
default = ["legacy", "spirv-to-msl"]
# Transitional ABI20 consumers; the default Linux SDK disables these defaults.
legacy = []
spirv-to-msl = ["dep:spirv-cross2"]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ogpu-vulkan-sys = { path = "../vulkan-sys" }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "=0.33.0"
block = "=0.1.6"
objc = "=0.2.7"
foreign-types = "=0.5.0"
spirv-cross2 = { version = "=0.7.1", optional = true, default-features = false, features = ["msl"] }
